problem_id: wx_rain_clf
task_type: binary
description: Dự đoán 24 giờ tới có mưa (tổng lượng mưa >= 1 mm) — nguồn Open-Meteo (ERA5)

source:
  type: open_meteo
  entities: ../_entities/open_meteo_locations.yaml
  options:
    models: era5            # ghim ERA5: giá trị đã chốt, không bị thay bằng reanalysis về sau
  variables:
    - temperature_2m
    - relative_humidity_2m
    - dew_point_2m
    - apparent_temperature
    - pressure_msl
    - surface_pressure
    - precipitation
    - rain
    - snowfall
    - cloud_cover
    - cloud_cover_low
    - cloud_cover_mid
    - cloud_cover_high
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation
    - sunshine_duration
    - wind_speed_10m
    - wind_speed_100m
    - wind_direction_10m
    - wind_direction_100m
    - wind_gusts_10m
    - et0_fao_evapotranspiration
    - vapour_pressure_deficit
    - weather_code
    - soil_temperature_0_to_7cm
    - soil_moisture_0_to_7cm

collection:
  schedule: "30 6 * * *"    # lệch 30 phút so với wx_temp_reg để không gọi API cùng lúc
  start_date: 2026-10-01
  interval: 1d
  frequency: 1h
  horizon: 24h
  maturity_lag: 7d

label:
  target: precipitation
  agg: sum                  # tổng lượng mưa trên (t, t + 24h]
  min_coverage: 1.0         # tổng chỉ đúng khi đủ 24/24 giờ
  threshold: 1.0            # mm — định nghĩa "ngày có mưa"
  operator: ">="
