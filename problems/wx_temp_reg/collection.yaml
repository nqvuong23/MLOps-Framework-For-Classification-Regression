problem_id: wx_temp_reg
task_type: regression
description: Dự báo nhiệt độ (°C) sau 24 giờ tại mỗi địa điểm — nguồn Open-Meteo (ERA5)

source:
  type: open_meteo
  entities: ../_entities/open_meteo_locations.yaml
  options:
    models: era5            # ghim ERA5: giá trị đã chốt, không bị thay bằng reanalysis về sau
  variables:
    - temperature_2m
    - relative_humidity_2m
    - dew_point_2m
    - apparent_temperature
    - pressure_msl
    - surface_pressure
    - precipitation
    - rain
    - snowfall
    - cloud_cover
    - cloud_cover_low
    - cloud_cover_mid
    - cloud_cover_high
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation
    - sunshine_duration
    - wind_speed_10m
    - wind_speed_100m
    - wind_direction_10m
    - wind_direction_100m
    - wind_gusts_10m
    - et0_fao_evapotranspiration
    - vapour_pressure_deficit
    - weather_code
    - soil_temperature_0_to_7cm
    - soil_moisture_0_to_7cm

collection:
  schedule: "0 6 * * *"     # mỗi ngày 06:00 UTC (ERA5 cập nhật theo ngày)
  start_date: 2026-10-01
  interval: 1d              # mỗi run phụ trách 24 điểm neo của một ngày
  frequency: 1h
  horizon: 24h
  maturity_lag: 7d          # ERA5 trễ ~6 ngày (đo ngày 2026-10-02) → chờ 7 ngày

label:
  target: temperature_2m
  agg: last                 # giá trị tại đúng t + 24h
  min_coverage: 1.0
